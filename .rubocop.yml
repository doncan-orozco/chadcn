plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - "lib/phlex/shadcn/icons/catalog.rb" # generated by .claude/scripts/shadcn/icons_sync.rb
    - "dev/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: space

# Tailwind class strings and generated icon paths are copied verbatim from shadcn/ui and lucide and cannot be wrapped.
Layout/LineLength:
  Max: 160
  AllowedPatterns:
    - '"[^"]{60,}"'
    - "'[^']{60,}'"
    - '%w\['

Style/Documentation:
  Enabled: false

Metrics:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false

# Compact `class Phlex::Shadcn::Button < Base` is deliberate: it keeps constant lookup identical to the original port, nesting would change it.
Style/ClassAndModuleChildren:
  Enabled: false

# Phlex components build on Phlex::HTML, whose initialize takes no arguments; parts keep their caller props in @attrs.
Lint/MissingSuper:
  Enabled: false

# Props mirroring React (`force_mount:`) are accepted and ignored by components without presence handling.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# Component tests build parts with empty blocks on purpose.
Lint/EmptyBlock:
  Exclude:
    - "test/**/*"
Lint/EmptyClass:
  Exclude:
    - "test/**/*"
Performance/CollectionLiteralInLoop:
  Exclude:
    - "test/**/*"

# Same layout as the host app's (rails-omakase) so the monorepo lints the gem identically from either root.
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable
Layout/SpaceInsideBlockBraces:
  EnforcedStyleForEmptyBraces: space
Style/IfUnlessModifier:
  Enabled: false
